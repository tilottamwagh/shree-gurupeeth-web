<!doctype html>
<html lang="mr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff9ef">
    <title>ऑफलाइन | श्री गुरुपीठ</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff9ef;color:#30251f;font-family:Arial,sans-serif;text-align:center}.card{max-width:440px;padding:32px;border:1px solid #eadfce;border-radius:22px;background:#fff;box-shadow:0 16px 44px #5b351c14}h1{margin:0 0 12px;color:#7d2515;font-size:28px}p{margin:0;color:#75675d;line-height:1.7}button{margin-top:22px;padding:12px 18px;border:0;border-radius:10px;background:#d85d1c;color:#fff;font:700 15px Arial,sans-serif}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>आपण ऑफलाइन आहात</h1>
      <p>श्री गुरुपीठ वापरण्यासाठी इंटरनेटशी पुन्हा जोडा आणि पृष्ठ रीलोड करा. या डिव्हाइसवर जतन केलेली अतिथी प्रगती पुन्हा ऑनलाइन झाल्यावर उपलब्ध होईल.</p>
      <button type="button" onclick="location.reload()">पुन्हा प्रयत्न करा</button>
    </main>
  </body>
</html>
